front:
  text: 漢天師世家卷之二壁二賜進士通議大夫工部左侍郎安仁張鉞校
  hash: sha256:2d1862f670285014e956b31599551d9051211d7151589c3ac1ce511550850e48
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5h0032_HFL_002-001a, image: hfl/1066/1066-034.png}
body:
  text: 天師世傳引天師之號見於素問莊子蓋謂有道者之極稱老聃子言道德於周祖天師倡正一教於漢而張氏號天師者今四十八代矣傳代歷歷何其詳哉千五百年盛衰相因廢興相尋未有如張氏一姓之獨靈長也豈非萃山川之秀合天人之妙而克然哉垂裕後昆吾莫知其己矣祖天師諱道陵字輔漢沛豐邑人也九世祖良逰下邳圯上黃石公授之以書後從漢高祖取天下以功封留侯語帝曰臣願棄人間事從赤松子逰卒諡文成侯嗣侯子不疑不疑子高高子通通子無妄無妄子里仁里仁子皓皓子綱綱子大順是為桐柏真人天師父也母夢神人自北斗魁星中降至地長丈餘衣繡衣授以香草曰蘅薇也既覺衣服居室皆有異香經月不散感而有娠漢建武十年正月十五夜生於吳之天目山黃雲覆室紫氣盈庭室光如晝昔之香氣復聞身長九尺二寸龐眉廣顙朱頂緑睛隆準方頥目三角美髭髯垂手過膝龍踞虎步望之儼然七歲讀老子書即了其義於天文地理圖書讖緯之祕咸貫通焉以及墳典所覽無遺從學者千餘人天目山南三十里西北八十里皆有講誦之堂臨安神山觀餘杭通仙觀即其地也後自浙踰准涉河洛入蜀山得鍊形合氣之書辟穀少寐永平二年二十五歲以直言極諫科中之拜江州令謝官歸洛陽北邙山修煉三年有白虎銜符至座隅建初五年章帝徴不起永元初和帝徴為太傅冀縣侯三詎不就逰淮居桐柏太平山獨與弟子王長從准入鄱陽登樂平雩子峰山神拜於道願受驅策命廟食峰下煉丹其間山神知覺而雙鶴導其出入遂棄其地泝流入雲錦山煉九天神丹丹成而龍虎見山因以名時年六十餘餌之益壯有神人自稱趙公眀從黑虎詣前曰願永護丹扃暨訪西仙源得制命五嶽檄召萬靈及神虎祕文於壁魯洞復往嵩山石室得三皇內文黃帝九鼎丹書及太清丹經乃曰昔禹平水土益焚山澤功垂萬世今地道失寧妖厲不戒吾徒無益道功未立聞巴蜀沴氣為災當往除之初居陽平山感太上授以經籙之法次登西城山築壇墠以降五帝或告曰西城白虎神飲人血以人為祭召而戒之梓州産大蛇鳴則山谷震噓氣數里中者輒死誅之復居葛璝山秦中昌利隸上湧泉真多北平稠粳渠亭諸山修九真之法得出入水火之妙及養神輕身之術還鶴鳴山漢安元年壬午上元感太上垂車駕五白龍降謂曰吾昔為尹喜說經今命汝溥度含靈吾當於此建立二十四治分命仙曹主掌世人罪福死生今經多劫職司六天稽核血食鬼神率據其所人鬼不分汝其復治之今授汝三五都功諸品經籙次授三五斬邪雌雄劎玉印魚鬛衣二儀交泰冠通天玉簡千日後會閬苑天師拜謝漢安二年七月一日登青城山山有鬼城鬼市鬼衆分為八部日為民害各有鬼帥領之及至鬼帥率其屬迎敵天師以丹筆書空鬼衆立仆招之復起或反風而火焚或揭日而霧散限以泰山壓以巨石鬼物哀號乞命請受約束遂命俱會於青城黃帝壇下使人處陽明鬼處幽暗誓曰自今已往天地交日月合汝若復出吾必誅汝立二十四治增置四治以應二十八宿正氣下通以六十甲子生人分屬各治每治立仙官陰官及祭酒之曹分統之其誠敬忠孝積功行者仙官録其善其悖逆奸貪恣肆狼戾者陰官紀其罪由是善惡之報捷如影響使蜀民向化定三十六靖廬七十二福地三百六十名山品秧各置神司之還雲臺謂弟子王長陽山有白氣彼妖也往治之道逢十二神女因問鹹泉伺在曰前有大湫毒龍伏其中以符投之妖舍湫而去旋涸插劍其下成鹽井神女各獻玉環一枚願奉符帚天師以十二環合而為一投於井中曰孰能得環者如所請衆女爭下取環天師遂掩而誓曰永為井神毋為民害有獵者逢於道戒以勿殺授以煮鹽之法民收其利即地創天師廟號清河府君之祠至今崇奉祈禱不絶過宋江察江中有妖篆石為函以錮之妖乃絶居主簿山神人夜獻玉壁居本竹山衆真降授靈寶經居蒙秦山遷渠亭山至雲臺山見絶壑中桃熟謂弟子曰孰能下取趙升下取以獻天師亦投下升長繼赴遂以神丹及諸經玄祕授升長居漓沅山為說經臺居鹿堂山煉九轉神丹居平蓋山合九華大藥至成都地湧玉局考子復降說諸經要永壽二年逰渠亭山奉太上玉册勑命為六合無窮高明大帝既而太上勑為第六代道之外孫而東海小童君為保舉師太上為度師封道陵為天師授三百人惟三人係代行治張申王升李忠也乃以經籙印劎付子𢖍戒之曰吾遇太上親傳至道此文總領三五步罡正一樞要世世一子紹吾之位非吾家宗親子孫不傳是日以丹付長升分餌於雲臺峰與夫人雍氏乘雲上升在人間者一百二十三歲王長趙升侍焉女文姬文光賢姬芳芝皆得道上升天寶七年詔後漢天師張道陵册贈太師唐中和四年封三天扶教大法師宋紹寧加號三天扶教輔元大法師唐玄宗皇帝贊曰邈彼炎漢天圖中闕萬彙消殘三靈蕩越惟師應運神威迅發躬侍玄元親傳祕訣妖毒雲驅崇山劎裂大布聲教全清壘孽一振無為永光有截鸞鶴斯邁丹青是設玉相真儀傳芳不歇又贊云邈矣真仙孤高峻節氣貫穹冥玄元示訣落落神儀亭亭皓月誅邪斬精魅驅鬼徹漢代盟威流傳不絶唐肅宗皇帝贊曰德自清虛聖教之實或隱或顯是朴是質靜處瓊臺焚香玉室道心不二是為正一宋徽宗皇帝封真君玉册文曰維大觀二年歲戊子十月丁丑朔十有六日壬辰皇帝御名謹再拜言曰惟道無方待人而行行惟物役資人而成若昔至真以道興世功被萬物則為神明務稱其休夫何敢不崇恭惟漢天師正一真人三天扶教輔元大法師體妙闡玄有大利於天下劉氏之季厥跡懋焉遂挾光景上超人羣秋籙真圖系傳於後弭除災孽𢷤禦不祥陰隲下民既久弭著不有徽稱何以極報典揚嘉惠謹遣朝奉大夫知信州軍事劉晏上尊號曰正一靖應真君夫道藏於幽顯於眀功施於速著於近匪我能然惟常弗息尚鑒觀兹益行其餘祐我邦家延及我民懋昭無疆之休俾嗣永世宋理宗皇帝制曰道家以清淨無為為宗篆籙丹竈吐納醮祭乃其法之祖而崇信者篤得非誘人以悔過趨善固名教治道之一助歟三天扶教輔元大師正一靖應真君受命璇穹降生漢代修真煉行乘雲上升二十四治及青城擲筆誓鬼三嵎化地作鹹泉靈迹在蜀不可誣也上饒龍虎山相傳為真君故棲玉印寶劍奕世授傳乃者京畿暵旱潮汐衝决懇祈響富實繁陰祐儒者諱言怪執古史一語過加詆訾是不知常善救人故無棄人與吾所謂惻隱之心仁之端奚以異乎其因舊稱加以美諡猋游無間尚克欽承可封三天扶教輔元大法師正一靖應顯佑真君元成宗皇帝制曰我國家以至仁上德崇奬不忘祖天師之遺烈靈風紀録具在若稽古典特畀加名三天扶教輔元大法師正一靜應顯佑真君煉氣成真除邪輔正羽儀凡世歷年千二百餘印劎單傳距今三十七代嗣孫與棣克承正法宗師留孫增潤先猷道雖本於無為德莫厚於追遠因時而顯記昔所聞夫授經於漢永壽之初當乙未之正月加諡於今元貞之歲又甲子之同符似有數存尚祈世濟可加封正一冲玄神化靜應顯佑真君是為天師一代二代嗣師諱衡字靈真精修至道不與世接被徴為黃門侍郎不就永壽二年龔教居陽平山歲以經籙授弟子克彰正一之道言約理朗聞者有感漢元和己未年正月以印劍付子魯曰汝祖以天地為心生靈為念誠敬忠孝為本周行天下除妖孽之為民害者是以親遇聖師建立大教嗣吾教者非誠無以得道非敬無以立德非忠無以事君非孝無以事親汝其遞相傳授世承人倫世遵成訓於是率諸弟子拜曰祖師志願弘博因家立教永世為宗緣與道符身為法嗣承先啓後厥任為難敢不祗勤用弘玄化言畢與妻盧氏於陽平山白日上升大元至大元年武宗皇帝制曰蓋聞古先哲王莫不以清靜寧民為本公孫有大隗之訪陶唐有汾水之往所以博求至理在囿天下也朕甚慕之天師正一之教其幾是乎今有司以嗣師位號為請惟師嗣守道器遺榮冲引尚安事名然繼宗開緒納俗安善之迹不可不表也宜有顯稱以致遐仰可贈正一嗣師太清演教妙道真君三代系師諱魯字公祺嗣師長子也少膺祖訓時漢祚日凌中州板蕩鄉上震動嘗募義以保障以道訓人從之益衆來學者教以誠敬不欺有疾者令自首其過立祭酒痊可循者使佩經籙率之趍善久皆自化時詔授典農校尉安民中郎將領漢安太守鎦焉克蜀有不臣之心請天師為督義司馬遂避名漢中積栗巨萬詔命為漢中南鄭二郡太守未幾秦兵雍兵亂衆欲以天師王漢中力拒之乃已魏兵又迫乃封府庫而退居南山魏太祖引兵入南鄭見府庫充實非有惡意甚嘉之卑辭遣使慰諭拜為梁益二州刺使封鎮南將軍關內侯食邑三萬户固辭不受謂使者曰吾修道士也世慕冲舉裂上之封非所願也請還印綬一日召嗣子盛以經籙劍印授之曰龍虎山祖師玄壇在焉其地天星照應地氣冲凝神人所都丹竈祕文藏諸岩洞汝宜往宣吾化修煉纍功遂於北斗峰上升弟衛字公則為昭義將軍棄官學道白日冲舉弟傀字公仁廕封為南郡太守加附馬都尉棄官學道白日冲舉子五人閻圃等皆侯俱不受元成宗皇帝制曰朕惟道之大原出於天而成之在人有漢天師之緒遠矣匪其子孫善繼善承不怠益大孰濟登兹是以代有異人出禆治化朕既加號於嗣師而系師景行焯靈昭於簡册妙於自拔功成不居經不云乎上德不德是以有德可贈正一系師太清昭化廣德真君四代天師諱盛字元宗系師三子也初居南鄭克志精修父命嗣教魏世祖封奉車部尉散騎侍郎加都亭侯不受携劍印經籙自漢中還鄱陽入龍虎山得祖天師玄壇及丹竈故址即其地為居以三元日自登壇傳籙以授四方學道之士動千餘人自是闡為科範率以為常以劍印付子昭成既以示化不踰年復於廣西賀州為廣王設法當謂人曰西蜀鶴鳴東吳龍虎功行既成再遊南土元至正元年贈清微顯教弘德真君五代天師諱昭成字道融元宗長子少學道不懈每端坐一室中出神數百里虎豹逢之皆伏壽一百一十九歲而化面色如生墓生靈芝百本或見白鶴往來及啓棺視之惟冠履存焉元至正十三年贈清微廣教弘道真君六代天師諱樹字德馨博通儒書安帝纍徴不起嘗逰鄱湖月夜一老翁登舟進曰聞師家以仙道立教願拜下風而無階可進今者不意仙蹤遠駐近津獲挹光儀乞示藴奧以啓昏愚遂告曰昔者得道之士皆由皈戒而入然質心於戒莫若質戒於心則萬法皆空一真常存翁知之乎遂起謝而去從者或見異光水天一色不知翁之所在天師笑曰此龍伯也水族是掌大道未聞故來有請居山時多神異之跡年一百餘歲尸解而去元至正十三年贈清微弘教玄妙真君七代天師諱回字仲昌初能言即問道是何物衆不能答慨然失笑而嘆五歲欲傳經籙父曰且讀儒書對曰祖書不讀讀他書何為十歲嗣教能辟穀日行數百里後入青城山不知所終元至正十三年贈玉清輔教弘濟真君八代天師諱逈字彥超幼得道丰姿俊美德量天成至誠存化請禱者無貴賤皆不吝輒有神應魏太祖嘗召赴闕問道年九十解化之日異香滿室經月不散元至正十三年贈玉清應化冲靜真君九代天師諱符字德信端肅明達凡經傳子史過目成誦經籙猶顯於時四方仰之壽九十三而化元至正十三年贈玉清贊化崇妙真君十代天師諱子祥字麟伯仕隋為洛陽尉棄官襲教服食精煉能吐丹置掌中光芒出户尋復咽之嘗遊河洛登嵩山中峰石室樂其幽勝時夜忽聞兵騎聲有二神吏謁曰東嶽主者道過謁天師主者曰昔會聖師於青城今四百餘載自魏晉以來亂離已久生靈受害罪業牽纏無由解脫今嶽司有幸重遇聖師願乞廣宣符籙庶俾超化言訖辭去天師還山分遣弟子宣化四方以積玄功壽一百二十歲而化元至正十三年贈上青玄妙大虛真君十一代天師諱通玄字仲達天性靜默常獨坐一室非時不出雖左右人亦常罕見歲大疫以標植水中汲飲者皆愈有持帛來謝卻之曰吾祖以濟人安可受謝乞符者雲集受經籙者益衆年九十七而化元至正十三年贈上清玄應冲和真君十二代天師諱恆字德潤經史過目悉不忘唐高宗遣使召至問以治國安民之道對曰能無為則天下治矣上嘉之尤善幻術自言吾神仙中之狡獪者一日自闕潜歸嘆曰吾幾落世網學道於家嘗推甕於室中對妻子茹葷飲酒夜發甕皆在瓮中經日不壞年九十八而化元至正十三年贈上清玄德太和真君十三代天師諱光字德紹勵志於道修煉居石室中垂三十年及襲教乃還家傳授經籙居常蔬食後能辟穀壽一百四歲而化元至正十三年贈太玄至德廣妙真君幼子名梧字君明自幼修煉能辟穀飛行往來不知所終十四代天師諱慈正字子明智慧明敏常以易道教人從者雲集每有餘資即賑貧乏棄妻修道山中登聖井山結庵獨處每歲三元日傳經籙則出山朝廷纍徴不起後百餘歲化空中聞仙樂聲下迎今聖井號徴君山溪號徴君坑元至正十三年贈太玄上德紫虛真君十五代天師諱高字士龍姿宇超曠好酒縱飲一石不醉唐玄宗召見命即京師置壇傳籙頒賜金帛免租稅册封漢祖天師號肅宗降香幣建醮於山中賜宸翰以贊天師像嘗忘玉印長安酒家有少年力舉之不能動明日天師至笑而携去年九十三化元至正十三年贈太玄崇德玄化真君十六代天師諱應韶字治鳯襲教後授其子以劍印隱居山南龍鬚井上躬耕自娛每據石吹鐵笛井上聲聞數里一日懸𥴦井上端坐而化葬井傍今有仙人墓竈構樹門在焉所耕之地號黃沙坑元至正十三年贈洞虛演道冲素真君十七代天師諱順字中孚至孝母疾經旬月不解帶每謂人曰人不忠孝而欲學道希仙是舍舟楫而涉大川也初任貴水尉棄官襲教携妻子結茅山中以居壽八十七而化元至正十三年贈洞虛闡教孚佑真君十八代天師諱士元字仲良瘠而多髯居應天山四十年山多虎人莫敢謁惟三元日則下山傳籙每大風雨或見其玄冠乘黑虎往來諸峰間知其為天師也今山南有丹舍山北有翻經石黑龍井碧蓮池皆其遺跡年九十二歲元至正十三年贈洞虛明道贊運真君十九代天師諱修字德真性淳朴躬耕於野以疾告者篆木葉治之即愈凡傳符籙有得隨以施人江西大賈劉遷者嘗受符籙一日死於金陵二日復蘇言為冥司所攝道遇仙吏曰常受法籙死期雖至可復延二紀遂入山中為弟子一日天師集諸弟子曰吾某日當化至日沐浴更衣端坐而化年八十五歲元至正十三年贈冲玄翊化昭慶真君二十代天師諱諶字子堅唐會昌辛酉武宗召見賜傳籙壇宇額曰真仙觀將命官辭歸不受咸通中懿宗命建金籙大醮賜金吊還山一日大醉而化年一百餘歲元至正十三年贈冲玄洞真孚德真君二十一代天師諱秉一字溫甫母嘗晝寢夢神人履金龜下降覺而有娠十有五月而生既長目光如電夜能視物常負劍行山澤開叱一老樹雷即震裂打死二巨蟒小蛇百餘南唐齊王夢墮井中有道士碧眼長髯衣絳衣掖出之占曰此漢天師也遂即龍虎山建祠宇賜水田天師將化曰吾去矣須地震乃殮已而果震七日乃殮體溫如玉壽九十二元至正十三年贈守玄紫極昭化真君二十二代天師諱善字元長幼不茹葷稍長遍遊名山三十餘年始還淵默內修不與物接壽八十七元至正十三年贈清虛崇應孚惠真君二十三代天師諱季文字仲圭五代之季人受其經籙甚衆乃鑄鐵環券繼之宋初鐵券籙尤盛壽八十七元至正十三年贈清虛妙道輔國真君二十四代天師諱正隨字寶神性質真敦朴不與俗接宋大中祥符八年乙卯召至吏部尚書王欽若為奏立授籙院并奉勑改真仙觀為上清觀年八十七歲而終宋真宗皇帝制曰朕嗣守宗祧欽崇天道荷乾坤之瑞應闡河洛之珍符思與至人共參妙道爾祖得靈詮於金闕垂法統於後昆汝為嫡孫紹承異學兹啓先天之祕以誘後覺之民惟帝鑒觀躋世仁壽肆頒徽號益衍玄猷賜號真靜先生元至正十三年贈清虛廣教妙濟真君二十五代天師諱乾曜字元光端靜寡言篤志內修宋天聖八年仁宗召赴闕間以冲舉之事對曰此非可以輔政教也陛下苟能返之朴行以簡易則天下和平矣奚事冲舉哉上嘉之賜號澄素先生上又問卿有幾子對曰長子傳道次業儒遂以次子見素為將作監主簿見素雖仕而志尤慕道以衛尉守丞休官隱居鄱陽東湖至今子孫家焉天師年八十五而化瘞劍仁福鄉樟埠曹家源宋仁宗皇帝制曰朕嗣服歷年潜心至道若稽黃帝之為君也所以養人民官陰陽而成無為之治者則有廣成子在崆峒之上不憚膝行順下風而問焉為民故也爾不遠千里至輦下一言悟朕得養生治民之要可無徽稱以示旌異尚弘神化用副招延罔俾廣成專美前古賜號澄素先生元至正十三年贈崇玄普濟湛寂真君二十六代天師諱嗣宗字榮祖生而左手有印文及龔教神異具著至和二年己未宋仁宗召赴闕祈禱有應奉勑遷上清觀於山之陽年七十八貌若童顔賜號虛白先生八十一而化瘞劍醹口寨宋仁宗皇帝制曰柴望秩宗乃禱祠之肇啓行宫藏事非巫史之可儕苟誠意之旁通亦治世之所賴漢天師二十六代孫張嗣宗紹承家學綽有祖風比露剡以箋天旋彌災而為福非道心精一至誠感神能若是耶虛空生白吉祥止止惟爾有焉賜號虛白先生元至正十三年贈崇真普化妙悟真君二十七代天師諱象中字拱宸生三月能行五月能言七歲召赴闕賜紫衣命嗣教賜坐問道大稱㫖上賜宸翰後歸徴君山梧竹塘結盧以居得道冲舉有七星墩白鶴塢存焉元至正十三年贈崇真通惠紫玄真君二十八代天師諱敦復字延之學識天成聲如洪鐘士林仰之宋熙寧間神宗召赴闕命醮於內殿賜號葆光先生年五十三而化瘞劍鄧家塢宋神宗皇帝制曰朕荷后皇眷顧之休藉祖宗盈成之業海宇寧謐民物阜康思弘清淨之風共樂無為之治漢天師二十八代孫張敦復世傳祖印早悟真詮惜遽返於丹丘遂莫前於宣室宜申簡册以賁烟霞賜號葆光先生元至正十三年贈太極無為演道真君漢天師世家卷之二

body:
  text: 漢天師世家卷之三壁三二十九代天師諱景端字子仁敦復之從子也性恬澹絶嗜慾不與物兢篤志玄學大觀二年贈葆真先生年五十二歳而化宋徽宗皇帝制曰朕惟禦災捍患祀典所先崇德報功聖人所尚乃者虚靖先生張繼先靖鹽池之妖氛藏金庭之醮奏如響斯答厥功甚懋推其本原蓋有家學而汝名號之稱朕甚慊焉特贈葆真先生元至正十三年贈太極清虚慈妙真君三十代天師諱繼先字嘉聞又字道正號翛然子二十七代天師之曾孫祖敦信父處仁仕宋知臨川縣宋元祐七年壬申十月二十日生於蒙谷庵五歳不言一日聞雞鳴忽笑賦詩曰靈鷄有五德冠距不離身五更張大口喚醒夢中人翌日宴坐碧蓮花上人皆稱異爲真仙今浴仙觀有池存焉九歲嗣教崇寧二年澥州奏鹽池水溢上以問道十徐神翁對曰蛟𧕏爲害宜宣張天師命有司聘之明年赴闕召見間曰卿居龍虎山曾見龍虎否對曰居山虎則常見今日方覩龍顔上悅令作符進上覽笑曰靈從伺來對曰神之所寓靈自從之上問能書否對曰臣嘗書道德經遂取進上間脩丹之術若何對曰此野人事也非人主所宜嗜陛下清靜無爲同夫堯舜足矣上悅侍入寢殿宫人競以扇求書以經語書之皆宻契其意中舉一握稽首書曰保鎮國祚與天長存乃上之所御也賜宴而出十二月望日召見上曰澥池水溢民罹其害故召卿治之命下即書鐵符令弟子祝永佑同中官投澥池岸圯處踰頃雷電晝晦有蚊𧕏磔死水裔上問卿向治蚊𧕏用何將還可見否曰臣所役者關羽當召至即握劍召於殿左羽隨見上驚擲崇寧錢與之曰以封汝世因祀爲崇寧真君明年三月奏鹽課復常五月召見賜坐問道法同異對曰道本無爲而無不爲體即道也用即法也體用一源本無同異若一者不立二者强名何同異之有上曰然若有同異便與言爲三矣囚進天心盪兇諸雷法上親祀之七月建壇傳授經籙演法講說道妙叅禮者雲集皆領悟而去上御天祥殿從容問道及時政對曰元祐諸臣皆負天下重望乞聖度從容悚然曰朕何所不容對曰陛下弘建皇極無偏無黨以天下蒼生爲念幸甚力乞還山上奬諭許之贈金帛皆不受命近臣具禮餞於國門四年復召建醮内廷因宻奏赤馬紅羊之兆請脩德宋徽宗皇帝制曰勑漢天師三十代孫張繼先天師在漢玄功著聞汝爲裔孫不替遠業傳龔祖法符水有功虚靖恬利道行高潔宜加顯錫昭尚真風賜號虚靖先生賜金鑄老君及漢天師像屢乞還不許問何所欲對曰臣所欲上清觀弊陋偏僻衆欲遷而新之力所未能命江東漕臣即山中度地遷建賜田以食其衆復立庵於山之北爲天師脩煉之所御書靖通庵額賜之有亭曰翛然并建靈寳雲錦真懿三觀改祖師祠爲演法觀奉玉册上祖師號封爲真君十二月還山凡父兄皆賜爵有差四方學者率數千百人大觀丁亥上遣使命醮於山中且召赴闕時徐神翁同館居無何神翁曰世事悠悠不如歸休對曰歸則便歸何思伺慮神翁遽坐而逝端陽召見宫中若有妖卿當祛之對曰聞邪不干正妖不勝德陛下脩德妖必自息内侍奏仁濟亭果有妖俄頃妖憑一少年以手抱頭泣拜天師曰汝心自昧墮在迷途返爾本形汝宜速化乃收泣仆地久之遂甦上復命以大甕數十貯水京畿取符投水中以飲有疾者凡飲者皆愈上遣使問道要且言神仙可學不死可致乃作大道歌授使以進歲大旱命禱之雨三日授大虚大夫辭不受御製詩以賜大觀二年還山賜金帛力辭曰巨一野褐爾得以無用公卿祖送塞道揖别曰聚散本常理出處無定期浮生倏忽諸公勉之還山與弟子曰江湘入蜀有二十八治义之自秦川還山即西源築庵居之扁曰渾淪沂陽瓊林臺北有爲愛西源好絶句五首時石自方從鄱陽來與之游一日語以死生之變自方曰吾得全於天不知好生不知惡死奈何得以死哉答曰不然爾謂得全於天天復得全於何真宰不明性識交熾一真獨露萬劫皆空則天亦無所全自方有省政和二年遣使復召以疾辭俾弟子王道堅奉謝以脩德彌災爲告勑改上清觀爲宫授道堅爲太素大夫凝神殿校籍命預禳國難遂還旴江王文卿皆以道術同顯於朝旣還山亦常徃還由是日曠逸自怡或風晨月夕窮幽極險徙倚歌咏每有自得一日題翛然亭壁曰赤帝御龍行未伏姮娥分月入深山人莫能測嘗遊麻姑憩齊雲亭歎曰蓬萊步入清淺其桑田乎靖康之變其言始驗丙午金人寇汴上與太上皇思天師預奏之言遣使亟召至泗州天慶觀索筆作頌曰一面青銅鏡數重蒼玉山恍然夜舡𤼵移跡洞天間寳殿香雲合無人萬象閑西山下紅日烟雨落潸潸書終而化時靖康丙午十一月二十三日京師亦以是日䧟族父武功大夫張憲適至率士民塟於龜山之下初天師在京時太學生陳東易觀以終身問天師曰陳東爲忠臣垂名不朽易觀爲縣以壽終高宗南渡陳東上言乞罷黄潜善汪伯彦東被殺易觀爲太和令家貧以年終天師旣化越十六年紹興辛酉西河薩守堅遊青城遇於峽口授以符法及水調歌一闋授書一緘履一隻令達嗣天師抵山嗣天師𤼵書異之令人啓泗州窆惟一履存方知其尸解後亦有遇於武夷羅浮者元武宗皇帝制曰朕惟廣成子在崆峒言契形神之妙唐桑楚居畏壘禮膺尸祝之榮矧奕葉振邁於眞風宜錫號優崇於昭代嗣漢三十代天師虚靖先生潜心冲默善性粹和道集虚而悟玄玄行履常而安止止嘗因宋主燕閑之問極陳老氏清淨之宗神得一以靈故禱祠而輒應物歸根曰靜惟精氣之長存是用增寵秩於仙階龔嘉名於祖牒仍羽人濯陽谷豈徒想於高蹤乘白雲歸故鄉尚秪承於先命封虛靖玄通弘悟真君三十一代天師諱時脩字朝英二十七代天師象中之孫敦直子也虚靖不娶無子弟淵宗爲道士擬令嗣教光輝清化虚靖遊泗州時以印劍經籙付之朝英以是衆推之以嗣教辭曰繼先吾從子也吾何後之衆曰法統所在遂嗣教乃恬然靜退志慕脩煉年六十一歲而化元至正十三年贈正一弘化明悟真君三十二代天師諱守真字遵一母吴氏娠十九月而生宋紹興十年襲教乾道六年毗陵有妖憑樹詔治之旣行一夕雷㧞其樹召赴闕賜號正應先生高宗召見咨問道法孝宗時江濤衝决命醮内廷有異應上賜以象簡寳劍清靜陰符二經賜號正應先生淳熈三年十月三十日謂弟子曰頃得吾兄虚靖書有青城之約今當徃矣言畢而化藏蛻於演法觀近西元孝宗皇帝制曰勑漢天師三十二代嗣孫守真爾傳之祖業載世數十而猶未冺亦異也己錫之嘉名厥有故事特授正應先生復贈崇虚光妙正應真君三十三代天師諱景淵字德瑩初名伯璟乾道間侍父入朝高宗異之改今名嘗醮内廷有大感皇子魏王鎮明州有疾爲壇以請至乃呪水飲之而愈禮送特厚一日復遣人致聘使及門忽召弟子曰吾仙期不可爽遂隱几而化瘞劍於上清莒家源元至正十三年贈崇真太素冲道真君攝天師諱嗣先字光祖乾道癸巳兄景淵曾以爲子年十九襲教崇寧中召入覲時景憲太子書樵隱二字賜之嗣教一十一年族長議以景淵有子當傳即以印劍付姪慶先退休樂道以終三十四代天師諱慶先字紹祖德瑩子也慶先未生德瑩嘗鞠幼弟嗣先權攝教位慶先以嘉泰辛酉襲教性慈儉周貧囚至是經籙之傳益廣飲酒數斗不醉嘗遊山之張公洞有井極深戲以木葉投之俄而波濤汹湧有一老人從井中出拜而有請戒之毋旱澇而去嘉定二年十月二十二有道人來謁禮敬甚恭旣去語弟子曰彼與吾有深約越七日晨興宴坐而化元至正十三年贈崇虚真妙光化真君三十五代天師諱可大字子賢曾祖三十二代天師守眞弟二子伯瑀之孫初景淵殁伯瑀常攝教事慶先殁嫡子成大幼可大父天麟攝教事寧宗召賜仁靜先生未幾成大早殁以可大爲慶先後紹定三年仁靜殁可大年十二正三十五代天師位時鄱陽水溢壞民廬室袁提刑甫請治之以符投江雷震殛死大白蛇水遂復故袁爲詩以贈端平年間累召赴闕賜鋟經貲嘉禧三年錢塘潮决水及艮山門民廬盡湮詔治之投鐵符潭中潮遂退又大旱蝗命醮於太乙宫雨作蝗殪七月召見賜號觀妙先生勑提舉三山符籙兼御前諸宫觀教門公事主領龍翔宫重建真懿觀賜田若干頃免租稅御書真風殿紫微閣真懿觀額上册加封祖師關石二帥龍井等神元世祖遣使訊之乃授以靈詮且言其後騐景定四年四月以印劍付次子宗演具表辭謝而化丞相江萬里爲銘瘞劍於瑞慶觀元世祖皇帝制曰道爲天地之常經妙叅造化名者古今之公器特示褒崇故三十五代嗣教漢天師觀妙先生張可大佩籙三玄蜚聲八極積功累行造彼希微禱雨退潮特其士苴昔先皇在潜邸遣間使詣珠庭知天命之有歸以靈詮而默授謂聖明當一四海其徴騐後二十年盖神與道俱洞測將來之數及遠懷近悅乆符前日之言乃眷真㳺盍頒異渥嗣師與棣克紹宗風宗師留孫總持玄教其立稷丘之祝仍加眞一之稱於戲冕服倘來非至人之所尚雲軒伊邇尚多貺之未伸贈通玄應化觀妙真君三十六代天師諱宗演字世傳號簡齊性淵靜少穎敏年十九襲教宋咸淳間信之上饒旱守臣唐震請祈雨應如期元世祖平宋遣使優諭召至勑廷臣郊迎待以客禮入見顧問者再六月醮於内廷明年又醮長春宫賜號演道靈應冲利真人給二品銀印命主江南道教事得自給牒度人爲道士路設道録司州設道正司縣設威儀司皆屬焉詔諭江南復宫觀賦役即京師剏崇真萬壽宫勑弟子張留孫主之後復兩召至闕禮遇有加一日有道人來謁告以玉兎之約時至元辛卯十一月十一日有獻白兎者語弟子曰吾昔以眀日生今以明日去矣遂書頌而化瘞劍於蟹田源後贈演道靈應冲和玄靜真君元世祖皇帝詔曰諭龍虎山張天師卿之先祖道陵用心精一得法籙之正傳甚有徴騐流布至今子孫相承已數十代二千餘年矣雖常聞卿之譽以兩國梗絶之故未遂延請迩者宋主不度德量力執我行人久留弗遣以故命中書左丞相伯頑率兵南伐上天眷合大江已爲我有南北一家今特遣武略將軍兵部郞中王世英武略將軍刑部郞中蕭郁賫詔召卿毋以易主遂生疑貳卿之先世自東漢以來歷事一十五姓無非公心未嘗有所偏執天無私心厥命靡常卿知道者寧想昧於是乎宜趨命駕毋多辭讓故兹詔示復宜知悉欽哉元世祖皇帝制曰三十六代天師張宗演卿心傳法統體粹眞風廣黃庭大洞之科持正一盟威之籙爰清爰淨以信以誠三尺青蛇役鬼神於冥漠一桮明水淨天孽於邇遐旣弘開濟之功宜畀褒崇之號特贈演道靈應冲和真人元成宗皇帝制曰盖公遇漢寧辭海上之招司馬在唐嘗應天台之聘按古來之達士多寓跡於名山惟出處之隨時乃周旋於中度三十六代天師演道靈應冲利真人管領江南諸路道教事張宗演慶衍仙靈之派學探靜定之功自王師臨鄂渚之初而妙道達世皇之聽芝泥雲號鳳書一下於江南金服瑤冠鶴馭三承於聖卷宗風爲之益振玄教爲之增光遐想仙游宜申卹典爰進陞階之號仍加節惠之丈於戲旌陽有術鎮蛟螭旣貽芳於賢嗣姑射所居無疵癘尚敷錫於編氓贈演道靈應冲和玄靜真君三十七代天師諱與棣字國華號希微子淵默寡言洞明三教爲詩文立成數千言甫冠侍父入覲儀表温瑩敏於應對上屢嘆異之至元辛卯嗣教應召上賜坐慰勞甚至授體玄弘道廣教真人管領江南諸路道教事成宗登極復召命醮於圓殿又醮於長春宫命天下行其醮典改天下諸路天慶觀爲玄妙觀一日忽謂弟子曰吾世味素薄今留京師且久非吾願也懇乞歸山未允越月示化於崇真宫遣使護柩還山勑廷臣祖祭於都門後塟於玉田元世祖皇帝制曰漢天師三十七代孫張與棣可嗣乃父演道靈應冲和真人以傳法統用闡玄風宜令張與棣准此元世祖皇帝制曰漢天師三十七代孫張與棣卿慶源有自化應無方宜頒紫誥之榮以作玄門之表特賜體玄弘道廣教真人管領江南諸路道教事元武宗皇帝制曰紹玄風而繼世率乃祖之攸行溥内則以䟽恩亦於今之所向嗣漢三十七代天師仙姑馮淑眞簮纓素緒鞶蛻芳儀媲穀城之傳益師清靜守栢舟之操彌篤堅貞愛祉惟深錫名斯侈雲龍風虎之慶會亶謂有光舞鳳迴鸞之制書茂承無斁授靖明真素仙姑三十八代天師諱與材字國梁號廣微子宗演次子天資仁厚爲詩文可立就書翰精竒至元三十一年嗣教上遣使賜冠服玉珮俾掌教事及召見明年改元元貞入見大明殿又明年制授太素凝神廣道真人兼管道教仍封母爲玄真妙應仙姑俾自給牒度道士免宫觀差役䕶法籙免遠輸之役大德二年海鹽官奏二州潮大溢百里沙岸嚙將及城下奉詔治之至杭州醮於佑聖觀投鐵符河圯處符躍出者三雷電晝晦磔死水恠魚首龜身長丈餘於水裔隄障復故五年復召至京丞相答刺罕請禱雨天師曰誠可格天天必有感眀日果雨上召問冬暖不雪民間得無有災乎命爲壇禱之是夜雪下盈尺六年辭𡚖上御柳林詔天師侍祠致嘉貺甚著且緘香使禱於所過名山宫觀𡚖醮於上清正一宫給銀印視一品加金紫光禄大夫留國公正一教主兼主領三山符籙加封二代嗣師三代系師皆爲真君母周氏爲玄真妙應淵德慈濟元君時皇太后在興聖宫仁宋在東宫皆寵賜特厚是歲夏多雨宰臣合散公留守大都遣禮部尚書王公約請禱越三日天霽仁宗即位復入朝賜見嘉禧殿詔太保曲出若曰予嘉天師之道其繼承之緒佗無與比者賜寳冠金服二年四月遣使至山諭曰去冬不雪今復不雨田弗就種朕甚不忍民之傷也禱於上清宫隨應遠近周洽每歲叅授法籙及以水旱妖癘來告者無虚日皆活之捐粟爲義倉以周貧乏藝術之士日集於門各如其望延祐二年秋與弟子遍遊岩洞或爲詩繪物皆寓意有警人莫能測除日復自賛壽像有東風吹雪之句越明年正月有一日雪口占遺頌而化勅塟於金谿之鳴陽建祠曰玄都觀元貞二年成宗皇帝制曰三十八代天師張與材卿虹芝標瑞金格蜚英學叅萬景之玄㣲籙闡三元之正教乃祖乃父已顯號之同膺難弟難兄冝真風之再衍特加寵錫庸示眷懷惟至人體道爲功卿當振靈山之緒以敬德祈天永命朕方崇璇室之科賜號太素凝神廣道真人管領江南諸路道教事元大德八年成宗皇帝制曰粤自上古相傳能爲國家除害正一初祖之於蜀嘗駈龍井之妖觀妙先生之於杭亦彌胥濤之患卿持法印之三載潮齧海鹽之兩州憑鐵符丹篆之靈殄魚首龜形之𧕏沙漲復隄防之固民居脫昏墊之災比囚江淛行省以聞俯酌玄教宗師之議精誠有感宜茂進於仙階清靜無爲尚欽崇于妙道特加正一教主兼領三山符籙餘爲故元至大元年成宗皇帝制曰惟除邪輔正關世教以爲多崇德報功宜邦彜之具舉維聖祖夙欽於至道而先皇屢欵于真儀兹嗣服之云初豈䟽榮之可後正一教主嗣漢三十八代天師太素凝神廣道真人管領江南諸路道事主領三山符籙張與材清偏偉望博學通村泓然理域之深融汎若環中之順應禦民菑而輒效持章猶虚請之精嚴祈福貺則隨臻餘戒具冲和之祗肅動靡端倪之可見勞奚章綬之能爲制則特頒理於兹順於戲封留足矣益光炎漢之高風自天申之永賛有元之丕祚徃綏燕履茂對鴻庥加贈正一教主嗣漢三十八代天師太素凝神廣道明德大真人領江南諸路道教事特授金紫光禄大夫封留國公餘如故元貞二年成宗皇帝制曰至道之用存乎人偉貞源之有自君子之學成其德繄兹閫之是儀太素凝神廣道真人嗣漢三十八代天師張與材母周氏惠恭德合冲和行資純素蒼圖分系本支迭紀于仙階珠樹聯芳兄弟繼傳于祖即于今可尚徃昔未聞特頒寵渥之隆庸慰孝心之至宜于後裔益增正一之光輝介邇遐年永奉宵晨之香火賜號玄真妙應仙姑元至大元年武宗皇帝制曰朕惟老子著道德言亦本孝慈之㫖西母在列仙藉可爲仁壽之宗方將敦俗化以養親故特崇閫儀而錫寵正一教主嗣漢三十八代天師太素凝神廣道眞人張與材母玄眞妙應仙姑周惠恭禔身貞淑秉性徽柔德嫓高門克義方之訓慶後裔益昌道紀之傳是宜頒天詔之五花以示報春輝之寸草問蓬萊水幾見海嘗清淺西池蓮開居姑躬山能使物不疵癘而年穀熟助揚正教茂介遐齡授玄真妙應淵德真人元延祐元年仁宗皇帝制曰修道者母爲先學仙者孝爲大泝其源之所自錫恩命以維新正一教主大素凝神廣道明德大真人領江南諸路道教事嗣漢三十八代天師張與材母玄真妙應淵德真人周氏惠德有德有功爰清爰靜來作神仙之侣維以末年繼爲天人之師幸哉有子指蓬山而歸去葉鼎卷以如遺雖冲漠不可强名而國家亦所宜禮肆頒美號式重玄宗於戲藏劎依壇尚想成丹之魏母飛茅建靖母志傳道之諶師爾逍遥歆兹優涯追封玄真妙應淵德慈濟元君三十九代天師諱嗣成宇次望號太玄子神清高遠端毅寡言至大三年侍父入覲至杭寓宗陽宫俄杭城火發衆徃求救發通江橋望火起處以水噀之火遂滅延祐三年丙辰留國仙逝以印劎授之命襲教開府張宗師聞於朝仁宗遣使至山命主教事且召之十月入覲上頋問甚至喜曰克肖而父命建金籙大醮於長春宫禮成賜冠服明年正月告𡚖制授太玄輔化體仁應道大真人主領三山符籙掌江南道教事推恩封母易氏爲妙眀慧應常靜真人降璽壽命掌道教給度牒行法籙免遠輸之役遣使護送還山七年鹽官州海潮復作詔即行省建大醮禱之投鐵符岸圯處雷電大作水息復故英宗即位詔入覲見於上都降璽書給驛護還泰定二年正月壬午日有食之大臣求禱雪以禳之天大雪復命建黄籙大醮於長春宫時有天花雲鶴之瑞國子司業虞集承詔記之制加翊元崇德正一教主知集賢院道教事四年鹽官州潮復决岸崩及城詔召至行省醮於佑聖宫有三足龜見殿上潮退杭民以旱告即雨至順元年入朝降璽書申護有加至元再召入見上於明仁殿時京畿旱詔禱雨崇真宫大應秋苦雨禱而霽冬不雪祈即應上大悅賜以上尊且語近臣曰朕煩天師多矣可録前後勳績備載制詞三年三月頒制加知集賢院事留京已久乞還山詔百官宴餞之旣還棄絶人事逍遥自娱至正四年甲申將遊五嶽青城先登泰山九月舟次吕梁薄暮有一老人求見宻語移刻而去明日遽命返舟庚子抵寳應化於舟中弟子奉冠劍還入鄱湖抵雲錦溪有二黑龍護舟疾行不六日泝流而達其神異若此後塟於南山元仁宗皇帝制曰天下有道宜崇清靜之風至人無爲爰佐隆平之治誕揚命號申耀宗乘嗣天師張嗣成得老氏之真詮實玄門之鉅擘自漢而下以其數考之一千餘年渡江以來於今四傳矣三十九代學邃瓊科之正聲騰絳簡之英嗣録云初來朝甚謹俾陟仙班之舊綜維教事之新賛皇極之建中衍洪圖之錫羡於𧇊維名不假朕特示於綏嘉率祖攸行卿盍思於報稱丕欽兹渥罔替其恭推恩封母易氏爲妙明慧應常靜真人别降璽書命掌道教元英宗皇帝制曰朕欽崇天命景慕道德求所以靜一而寧民者與言至人榮及後裔嗣天師張嗣成由爾祖能傳老氏之㫖遵和崇正扶植世教世其家者繼顯在爾器識弘達博學多聞自先朝以長而賢俾嗣名號承志篤善克勤不怠每懷冲退令聞益彰朕踐祚之始爾奉幣來朝執儀甚謹良用寵嘉申命宜新循乃舊職尚一爾心用弘爾教恭畏祗肅協賛無爲之治毋替厥服徃惟欽哉特授正一教主嗣漢天師太玄輔化體仁應道大真人主領三山符籙掌江南道教事元晉王制曰我國家之崇玄教古莫與倫卿家世之被皇恩今爲特盛宜隆稱號爰示寵嘉嗣天師張嗣成氷雪神人風雲聖代乃祖乃父累功積行於前若子若孫繼緒增光於後及此初元之覲助予敬德之新翼翼小心乆謂恪恭而有禮巍巍大道共期清靜以無爲特授翊元崇德正一教主嗣漢天師太玄輔化體仁廣道大真人主領三山符籙掌江南道教事封胡氏爲明慧慈順仙姑元順帝制曰老聃度函谷關未始忘於天下留侯從赤松子豈果棄於人間式開聖人神道設教之門遂任天子爲民請福之寄世傳法者代有功焉不遠而朝宜新厥命特授翊元崇德正一教主嗣漢三十九代天師太玄輔化體仁應道大眞人主領三山符籙掌江南道教知集賢院事張嗣宗神明之裔道德之宗自爾祖之遇世宗乃父之於仁廟旣膺天眷兼簡帝心雖膺有道之長實繫聖明之主而樂無爲之治庶闡清靜之風誕布玄休屢昭靈應卿旣克承於後朕亦丕勞爾先徃者海水爲災再免黔黎於昏墊近而天時作慝三致雨雪之感通功成弗居禮宜有報噫神仙以忠孝爲本尚母媿於傳賢帝王以天地爲心曷敢忘於敬德見所帶職號如故四十代天師諱嗣德號太乙與材第二子也性寛厚善文好詩至正甲申嗣教後九年壬辰天下兵興命弟子舒惟寅募義保障凡隣郡間兵不敢犯民賴以安是年十月㣲疾而化明年制授太乙明教廣玄體道大真人主領三山符籙掌江南道教事制下已化矣藏蛻排衙石元順帝制曰正一仙真克紹經籙符章之秘神明華冑宜膺冠裳劍印之傳仙籍有徴寵章再錫咨爾張嗣德學資家訓道演宗盟祖禰流芳雲仍龔慶始著飛昇於蜀漢世施度化於江湖寳籙金符瑞應昔昭於簡册青蛇玉劍淵源永緒於箕裘歷彰紏攝之靈每佐清寧之治涣號雖基於前代綸恩猶渥於本朝紫誥銀章禮重褒崇之典珠冠金服光貫冲素之流玄門偶闕於承宗法嗣共推於嫡嗣卿其奉真元之秋律肅太上之精筵恪思繼業之隆益拯含生之沴再揚靈素永播眞風於戲珪幣多儀務念輸誠以事帝壇秘祝慎嚴徼福以庇民尚體予裏以弘爾教四十一代天師諱正言號東華嗣德長子也貌古神清沉靜寡言時京道不通且二年餘矣江浙行省遣間使傳制授天師明誠凝道弘文广教大真人主領三山符籙掌江南道教事踰年集諸弟子曰吾家世代以福國忠君化民爲本今天下兵爭日久朝廷去遠安危未可知况吾諸弟子總玄教於北者榮遇特隆可無一言以致徴兆之吉乎於是介弟子程天翼奉命言於玄教大宗師於有興入陳於朝上曰天師方外士也曩以川途梗塞無以致撫安之道朕甚慊焉天命此幸有以旋之宗師奉㫖俾天翼還報歲己亥中元日陞座演道語若有警人鮮能測未幾示㣲疾召弟子曰吾自襲教以來遭時多難今逝期至矣越二日書頌而化四十二代天師諱正常字仲紀號冲虚子三十九代天師太玄公之冢子也生有異徴大玄公假寐夢神人飛空而至曰余自華盖山來逰君家願見容也及覺而生幼穎特寛厚雙目燭人性嗜老莊言於仙道秘法尤篤志大玄遊五嶽指相傳印劍曰龍星再集於亥吾兒當持此大振玄風至正己亥龔教太玄之懸記始騐時兵亂經籙久秘至是願授者川至闡三元醮脩於玄壇嘗鍊度幽爽輒有異感辛丑我大明太祖高皇帝𤼵御榜命有司訪求招聘而天師始逰遣使者上牋陳天運有𡚖之符上以手書賜答有勉澄心定性以凝道功之語乙已朝京師上召見悅曰瞳樞電轉法貎昂然真漢天師苗裔也命坐賜燕下詔褒美之再召宴及錫以金幣還山丙午復入覲京城士庶求符者日以千百計侍史不能給閉關拒之不止上諭俾施符水乃篆巨符投朝天宫井中人爭汲之須臾水竭見土弗己疫者飲之皆廖上聞而嘉之令作亭井上號曰太乙泉命傳太上延禧諸階法籙及辭還山復詔中貴人齎賜織文金衣特勑中書給驛券畀之以便朝覲吴元年丁未詣上勸進牋洪武戊申上登大寳位建號改元入賀賜宴於便殿諭曰兹授卿以大真人稱號誥命議給俸禄面奏懇辭議俸止乞如故事優免及專出符籙之事上嘉而可之准賜蠲通户及大上清宫各色徭役宴畢内降制書國朝制詞具載皇明恩命世録授正一教主嗣漢四十二代天師護國闡祖通誠崇道弘德大真人領道教事仍給銀印視正二品特設玄幕之佐曰賛教掌書等官陛辭而還上御謹身殿從容謂曰卿乃祖天師有功於國所以家世與孔子並傳以迄於今卿宜體之以清靜無爲輔予至治則予汝嘉出白金十五鎰賜之俾新其宅第己酉二月特召入朝上御奉天殿賜見預命設宴待之是月承顧問者四錫宴者二三月十三日上將通誠於天帝致齋三日上御衮冕服親署御名於章勑太常設樂手授於真人俾祝而焚之禮成錫金幣宴於文樓羣弟子饗於别館仍賞賚有差庚戌夏上録功馳寵特勑吏部改贈父三十九代天師太玄輔化體仁應道大真人嗣成爲正一教主太玄弘化明成崇道大真人改封母明慧慈順仙姑胡氏爲恭順慈惠淑靜玄君是年秋上復召見問以鬼神情狀更給掌天下道教銀印壬子秋特召入覲復加賜永掌天下道教事之誥以寵之丙辰秋上遣使召忽先期而至入見上喜曰卿來何符朕意耶明年秋朕將遣使祠海嶽諸神卿當妙柬弟子之清脩者與其偕來錫燕及金法衣玉圭珮法器之屬丁巳夏率羣弟子入覲宴於午門城樓上舉爵謂曰卿宜罄此一觴勑内侍出御製歷代天師賛示曰他日當書以賜卿明日勑遣代祠嵩山分遣重臣與弟子代祠羣岳仍賜衣各二襲楮幣有差旣還錫宴賞如初及歸山志趣頗異常一日置酒與昆弟酣飲慨然歎曰五嶽名山先子欲逰而弗遂嵩山中峰乃吾祖得太清丹經之所今藉聖天子威靈幸一至焉嚥曦景於層霄邈浮埃於浩刼吾志將有在矣咸訝其言未幾示以徴疾瑞坐榻上屬弟子方從義曰吾無以報國家寵恩爾等宜左右我子孫以賛寧謐之化命取印劍授其子曰我家千五百年之傳在是汝其勉之語已舉手作一圓象嘿然而化是夕大崖石崩聲聞數十里禮部尚書張籌爲訃聞上嗟悼良久且曰朕欲命其徧祠五嶽今方一至嵩山何期大數止於斯耶遂親製文一通遣前浙江行省叅知政事安慶弔祭之藏蛻於南山刺坑口四十三代天師諱宇初字子璿别號耆山冲虚之冡子也目秀雙瞳而交二斗九歲嶷如老成一日有異人謁見曰是列仙之儒異日丕張斯教者也及長資識夐高學問深造貫綜三氏融爲一塗旁及諸子百家之籍靡不窮蒐𤼵爲載道紀事之文各極精妙著成峴泉文集二十卷遼王嘉而梓之因徹上覽以是被前席寵尤渥而王公縉紳之士亦莫不敬重焉嘗侍冲虚於天心水月樓目覩雲霧起西北中有金扉洞開五色晃耀護衛天神鎧仗森列勃然改容冲虚問之具對如所見自是以家秘授之易了試之益神洪武十一年入朝上召見反覆諦視之笑曰絶類乃父眷賚有加明年上特遣使詣山齎賜詰勑二道授正一嗣教道合無爲闡祖光範大真人勑召赴京復降手勑勉加脩節以格神明之意賜法衣金幣給驛劵還山辛酉錫誥封母包氏爲清虚冲素妙善玄君癸亥召赴闕命建玉籙大齋於紫金山乙丑命禱雨於神樂觀隨應庚午入覲奏准降勑重建大上清宫辛未六月朔上視朝㫖諭禮部嚴禁僞造符籙者賜正一玄壇之印俾關防符籙永鎮名山旣還擇地於里之黄箬峰下搆峴泉精舍爲終焉之所壬午成祖文皇帝嗣登寳位入賀寵遇益隆賜緡錢葺大上清宫永樂元年命陪祀天壇丙戌命編脩道教書以進丁亥召見命就朝天宫建薦揚玉籙大齋有慶雲覆壇鸞鶴交舞之瑞祠官以聞賜勑嘉奬戊子三月降特㫖申諭真人門下專出符籙四月命傳延禧法籙建延禧大齋五壇咸有瑞應厚賜尚方珍物特命更給驛券還山十月手勑俾邀請真仙張三丰己丑再勑尋訪張三丰庚寅春忽𤼵神異語人莫能測一日以印劍授介弟宇清曰吾將返吾真矣惟國恩未報爾其承此以圖之又越三日書頌曰一點靈明本無生滅五十年中非圓非闕今朝裂破大虚空三界十方俱透徹舉手前向指而逝時大駕駐蹕北京皇太子監國遣行人陳逵賜祭明年天衷追悼復遣行人蕭榮諭祭焉藏蛻於峴泉四十四代天師諱宇清字彦璣别號西壁冲虚仲子耆山之弟初冲虚夢壁魯真人峨冠宋衣入其室翌日生七歲能詩及長凡秘要儒經子史究索無遺著有西壁文集傳於世永樂庚寅嗣教十月大駕南還召見賜宴及冠服圭珮之屬命醮於朝天宫賜誥授正一嗣教清虚冲素光祖演道大真人領道教事癸已七月勑遣使齎賜太嶽圓光圖并榔梅百顆八月降勅俾選有道行羽士爲武當山住持九月命使詣山就大上清宫建金籙大齋七日感龍井出見之瑞上給緡錢俾市魚放養溪中賜名曰放生池禁止網釣乙未詔修太上清宫并勑建真懿觀造浮橋築隄防丁酉命分獻西鎮壇十一月詔徃福建靈濟宫修建祈謝金籙大齋瑞感圓光燭霄卿雲成幔鸞鶴交舞靈貺叠臻祀官以聞降勑嘉奬仍有金幣之賜戊戌二月勑召入京賜冠服綵幣白金百鎰命祠玄帝金像於太和山五月命治浙江潮患乃書鐵符戒弟子黃端友徃投之時波濤汹湧若有人馬呼鳴之聲旣而水退患止有司以聞上遣使嘉奬賞賚己亥誥封妻孫氏爲端靜貞淑妙惠玄君復有金幣錢物及番果海魚之賜庚子上召見命率羽士修玉籙大齋休徴尤夥十月命建普度醮於京之靈濟宫辛丑正月朔命分獻星辰壇復建保安醮七日賜冠服圭珮錦綺貂裘之屬上北伐還京命建祈謝大齋感祥光慶靄之應賜賚有加特勅褒奬甲辰命醮太和山仁宗昭皇帝即位入賀命修薦揚大齋亦有異徴仍降勑奬諭賜金玉法印并織文金衣鶴氅貂裘圭珮綺幣及從行弟子賞賚有差宣宗章皇帝即位宣德改元入賀錫燕内殿四月推恩申錫嘉號之勑六月加誥封爲正一嗣教清虚冲素光祖演道崇謙守靜洞玄大真人掌天下道教事丁未入覲詔下有司悉蠲僕從丁役五月三以老辭上還山一日中秋集衆飲闌而作頌曰易窟探周行訪浮丘乾虹橋畔坤雷渡頭咦宇内清光半是秋半爲貞氣還天表忽迅雷大作有虹隨見光滿山谷而化訃聞於上遣太監雷春諭祭復勑葬於北真觀之右山漢天師世家卷之三

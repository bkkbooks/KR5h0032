front:
  text: 漢天師世家卷之四壁四四十五代天師諱懋丞字文開别號九陽處心恬澹不膠於物又號曰澹然冲虚嫡孫耆山西壁之從子也初父宇珵於洪武丙寅臘日宴坐中庭突有道者謁見衣貌甚竒自稱重陽子遺以菊花一本曰願假館門下六十年語畢忽不見始異之後覺其爲重陽真人也明年九月九日天師生時有菊香滿室紫雲覆屋三日乃散四歲效作禹步感雷聲隱隱人以爲偶然命再步雷輒大震及授儒經玄秘日記萬言文章書法卓冠時彦嘗經山澤或謂垂木前障過者傴僂請從間道天師曰予任己民之責矧正人不由邪徑頃之烈風大作至則樹已㧞矣入京過武林民多疫求符者不能悉給乃書鉅符投井中人競汲之水爲竭飲者廖焉遊華蓋山祥光屢現天燈夜如星布其神異感格大都若此洪武二十二年父宇珵蒙太祖高皇帝聞其賢召偕無爲眞人入對雅稱㫖賚以金幣命前御史中丞誠意伯劉基以其弟之子妻之天師乃劉氏所生也及入覲賜燕便殿明年命傳太上延禧籙建延禧醮於大内禮成賜冠服劎珮之屬四月陪祀太廟錫誥授正一嗣教崇修至道葆素演法真人領道教事己酉春入賀萬壽節命分獻東鎮壇俾醮於仁智殿賜賚有加三月上御西宫召見與語大悅奏舉上清宫高道操克弘龔繼宗顔福淵黃嘉佑等爲道録職員詔可遣中使黎都詣山起之十二月錫誥贈故室孫氏爲柔嘉貞靜玄君辛亥入覲命分獻星辰壇醮於内皇壇有尚方八寳金幣之賜四月陪祀太廟禮畢特遣中官護送還山癸丑冬入覲明年春命醮於靈濟宫三月會青宫不豫召入治而安之上悅賜冠劍衣舄命分獻風雲雷雨壇命保安醮於大德觀復有金幣之賜給部牒五百度羽士辭𡚖留之五月召對於内庭賜御製招隱歌還山抵甲馬營傳舍上復遣使追授宻勑勉以脩鍊之學勿墜宗範云英宗睿皇帝即位正統改元入賀勑建天師府於朝天宫内東北隅此先帝之命至是落成遣禮官迎入府居之給以餼廪命脩昇真大齋於本宫明年元旦賜燕於奉天殿十一日俾分獻風雲雷雨壇明日召見繼召衍聖公同宴便殿各有金幣蟒衣朱履之賜本月命傳太上延禧諸籙建金籙延禧醮於朝天宫賞賜有加己未春命分獻東鎮壇二月皇太后聖壽節建祝延醮於朝天宫禮成賜金幣庚申錫誥封繼室董氏爲温靜柔順玄君三月命安祀玄帝金像醮於大内玄天祠禮畢命以祖傳印劍進覽上撫摩久之歎曰神物靈異果如是乎燕賚而出辛酉春正月命分獻東鎭壇醮於朝天宫給部牒五百度羽士厚賜而還壬戌冬入賀錫宴文華殿癸亥春命分獻星辰壇醮於朝天宫明年辭𡚖奏曰巨沐兩朝寵恩無由仰答萬一恐巨天賦有限不能長侍陛下清光矣有一子早不禄嫡孫元吉雖及髫歳資稟頗竒願以代臣補報上慰留至再乃許抵家以印劍付元吉曰吾已得請於朝孺子懋之永承天眷語訖端坐而化壽五十有九果符假館之數訃聞詔遣禮部郞中趙最諭祭工部主事江清塋塟於馬鞍山建觀曰南極以祀之四十六代天師諱元吉字孟陽别號太和澹然之孫贈寂靜真人子也母玄君高氏夢長庚星如虹下流化爲白鳳集於懷及覺光猶滿室感而有娠乙卯春正月九日生時有靈芝出東柱礎下自幼明敏絶人凡祖秘儒書一覽輒了喜爲詩詞然所發皆非塵世語讀者莫不竒之正統乙丑冬赴闕時年甫十一上見之愛其岐嶷如成人召入内庭命坐賜茶錫誥授正一嗣教冲虚守素紹祖崇法真人領道教事厚賜而還丙演冬召見於仁智殿命書趙天君符恍惚有神虎哮吼之聲上驚異嘉嘆賜冠服圭珮及金幣之屬誥贈父留綱爲正一嗣教崇玄養素寂靜真人封母高氏爲慈惠靜淑玄君丁卯上念其幼孤賜勑諭禁治族屬侵侮之輩更授賛教掌書等官輔之戊辰上御大善殿召對稱㫖有萃寶冠金文服之賜己已正朔命分獻星辰壇三月辭歸諭留之夏六月雷撤謹身殿瓦擊蚩吻雨浹旬不止召問以愼起居戒邊防爲對命建祈晴醮於朝天宫檄召雷神有巨鷹藍距赤翅挾大風而唳蓬萊門攫檄排雲而上觀者駭然色變應時天朗氣清祠官聞上喜愕交至賜賚有加秋七月上北狩皇后命建保安醮於内庭景泰改元秋八月景皇帝召入覲顧問者再命建保鎭國祚醮於大德觀有天花雲翯之瑞降勑褒嘉明年二月給部牒一千度羽士壬申冬命醮於内庭禮成賜燕仁智殿癸酉春命分獻風雲雷雨壇醮於朝天宫乙亥春上御文華殿召見問諸雷秘法命作符大悅曰神明之冑代不乏人可謂善繼矣當時以爲榮四月命建金籙黄籙二大齋於靈濟宫有卿雲覆壇五色盤旋如車盖鸞鶴羣至聚觀者數萬人祠官以聞上嘉錫誥加封爲正一嗣教冲虚守素紹祖崇法安恬樂靜玄同大真人掌天下道教事賜玉冠圭珮衣履之屬特命尚方良冶作法劍一口賜之遣中使護送還山天順元年英宗睿皇帝復位二月入賀命建祈謝醮於内庭寵賚逾厚七月頒勑申禁僞出符籙及族屬欺凌者己卯冬入觀賜燕内庭再命傳太上延禧諸秘籙庚辰春命陪祀天壇上御齋宫垂清問對稱㫖賜金練衣錫誥加封母高氏爲太玄君辛己四月上遣使齎勑詣山召赴闕俾醮於大内玄天祠有異兆七月祝融扇燄於承天門命就朝天宫建祈謝禳熒醮七日致感河泊驅波御溝驟溢上嘉奬深至賜以冠服劍器及從行弟子賞賚有差復召對奏乞大赦天下明年三月陛辭而還抵潞河上遣錦衣衛百户劉昇令以原給驛劵外加賜馬快船追送之甲申春入朝上登寳座輒有影響命書符劾之明旦有異爲斃於氈裀之下命中官錢義率旗校舁出朝天宫火裂之響遂息上嘗睡覺足隱隱痛要忍亟燭之有黑痕似人指點狀遣内使傳㫖諭乃進符水滌之痕退患愈未幾上御奉天殿聞空中有如木石墜壓之聲天衷悚懼命醮禳謝是夕其聲寂然尤加禮重錫誥加封爲正一嗣教體玄悟法淵默靜虚闡道弘化妙應大真人掌天下道教事加封慈惠靜淑太玄君母高氏爲慈和端惠貞淑太玄君厚賜還山憲宗純皇帝即位成化元年九月入賀賜燕於文華殿明年正月上遣中官齎賜天廐良馬及文錦朱舄黄封上罇番果海魚等物爲壽翌日入謝仍賜燕内庭十一日命分獻風雲雷雨壇二月命建昇真醮於大德觀賜勑申禁族屬侵犯及諸人僞造符籙并授賛教掌書等官助理玄政丁亥秋入朝召見於大善殿命以祖傳印劍進覽上回重瞳久之嘆曰物之珍毖果有神靈賜燕而出十一月上復御大善殿召對聖語勉以䕶國安民更給正一嗣教大眞人府金印又加賜玉印各一顆御書大真人府四字命梓縣於府第閥額三錫恩綸加封爲正一嗣教體玄崇默悟法通真闡道弘化輔德佑聖妙應大真人掌天下道教事仍遣中官秦勤齎賜蟒衣玉帶冠履劎器圭珮之屬寵賚獨盛朝野榮之己丑冬召見命建金籙醮於朝天宫辭𡚖出逰歷登名嶽探仙人舊隱之跡去六載方還徑抵龍虎嵒下結茅却粒者三年一日書頌畢端坐而化舉之如空衣矣塟於本里播箕灣四十七代天師諱玄慶字天錫别號貞一又號七一丈人生時有異徴博學能文長於詩書成化丁酉入覲錫燕内庭遣中官梁芳傳㫖聘成國公朱儀女爲配明年詎赴南畿完婚仍賜蟒衣玉帶加撥馬快船隻送回誥授正一嗣教保和養素繼祖守道大真人領道教事封母吴氏爲志順淑靜玄君甲辰賜勑諭申禁諸人僞造私出符籙及偷盗放生魚乙已春特勑江西守臣重建大真人府第命降香大華盖山及鐵柱宫丙午入覲命醮欽安殿有玉帶金幣之賜孝宗敬皇帝即位弘治戊申入賀寵遇有加庚戌夏雷擊謹身殿柱建祈謝醮於欽安殿感天花慶靄之祥上嘉賚之又命祈聖嗣醮於内庭明年皇太子生賜雕花天禄壽字玉帶金冠蟒衣銀幣之屬丙辰上遣太監李瑾李珍齎勑俾建保民大醮於大上清宫以守臣鄧原并兩司掌印官陪祀召羣鶴舞空卿雲疑蓋之瑞戊午冬命祈雪於朝天宫明日大雪己未春命傳太上延禧秘籙賜牙刻印記二函并金幣陛辭而還五月行舟次沽頭閘旱淺不前分司主事蒙某請禱乃書鐵符投白象潭薄暮雲宻雨如注旌枻揚焉辛酉冬詔携嗣子入朝上御欽安殿召見錫嗣子衣帶命坐宴於殿中乞致仕可之明年春遣祀長陵迴復賜宴便殿授致仕勅書以榮之四月遣齎香旛達天目葛仙華盖武當鶴鳴五山還報命奬勞宴賚踰常差通州衛指揮率官兵䕶送歸山甲子嗣子入覲以自畫聖像及上意所欲古劍等物附獻上以祖天師畫像及金幣回賜之乙丑春二月聖衷注念特降褒問之書又勑俞徃武當鶴鳴葛仙三山之遊附御前香燭令轉致三山以表禮神之意於是躋眺危巓窮探靈窟後次鶴鳴之崎嶇邂逅一鶉衣鶴貌老翁迎而揖之作而笑曰來去不聞山爲喧三生石上龍蛇年即拂袖縁崖而逝天師游睇良久悵然返旆己已秋九月張筵會客縱飲極歡舉觴謂林方伯王憲副曰吾有老友之期不可失恐此會難又惟公等任天下治平之望者勉旃可也咸以爲醉語勿諒酒竟後戒左右置蒲團於玄壇之西從容理裾北向盤坐乃再誦老翁言而化藏蛻於金谿長生觀四十八代天師諱諺頨字士瞻别號湛然先是貞一翁夢神人佩劍植梓於庭而生及長有祖父風弘治辛酉甫十二歳奉詔隨父入朝上顧而竒之賜宴欽安殿命坐三宫俱召見賞賚有差誥授正一嗣教致虚冲靜承先弘化真人掌天下道教事𡚖而求學不輟玄秘旣精涉獵墳典事親篤孝鄉族稱之武宗毅皇帝即位正德丙寅春入賀召見問曰鄉之祖非神仙乎朕聞神仙長在今還可見亦可學否對曰臣聞君類愈於神仙者堯舜是也至今猶存上自天子下及庶人未嘗不見願陛下慕而傚之則聖壽可等天地矣乃若臣類爲神仙者奚足尚哉奏辭還山戊辰頒給部牒普度羽士庚午䟽請重修大上清宫以成先帝遺命勑遣内官監太監李文會同江西鎮巡等官督造壬申召見命陪祀泰壇有蟒衣玉帶之賜庚辰車駕南狩或言牛首山後湖各有妖召赴行在諭徃除之果見磔死一妖上大悅勅扈駕還京世宗肅皇帝即位嘉靖改元入賀上賜問以清心寡慾爲對稱㫖寵賚孔殷特遣還山請太上諸秘延禧籙文以進癸未詔聘安遠侯柳文之女爲繼室勑留都内外守備官陪徃親迎丙午錫誥加封爲正一嗣教懷玄抱真養素守默葆光履和致虚冲靜承先弘化大真人掌天下道教事復賜加封勑書並准授上清宫道士傳德岩邵啓南爲賛教金永壽詹望奎爲掌書等官勑徃禱於太和山三月勑遣内官監左少監吴猷會同江西撫按重建大真人第增造勅書閤以尊藏累朝宸翰西立萬法宗壇以奉上帝列真東盖天師家廟以祀歷代真人餘悉更置山水增輝遂爲福地冠先是上命範銅爲神像成乃勑吴猷齎至萬法宗壇安祀頒賜掌法仙卿銀印一函牙刻宗傳之印一函詔下户部查復上清宫田糧侵匿於豪民者仍降勅禁䕶戊子入覲命陪祀星辰壇有御札文綺之賜辛卯入覲驛傳艱阻至京後期上問故以實對勑各巡按御史查提違慢有司等官罪之明年三月勑遣内官監左監丞曹玉會同撫按重建大上清宫乙未以本府莊田有司違例編寄莊各縣差徭奏下户部議止照品官例優免覆奉命悉蠲之仍著爲令丁酉入覲驛遞逓慢如初奏謝後期之罪奉聖㫖大眞人張彦頨𦁕領道教赴京朝賀先朝屢有明㫖著沿途有司應付這各該地方官吏如何不行支給著巡按御史查提了問巡撫官且不查究今後務要嚴加戒飭軍衛有司一體應付不許遲延悮事該衙門知道是冬無雪命禱於内庭即應上大悅有金冠玉帶蟒衣銀幣之賜戊戌命建金籙大齋於内皇壇有白鶴繞壇卿雲捧日之瑞賞賚有加辭𡚖賜勑以護其行本年詔徃齊雲山建報謝禱禳大醮後因奏乞以本山如太和山例除道士爲住持管理職員賜神宫額名曰玄天太素官免徴所餘香錢降勑禁護是年冬聖母升遐明年上賜手書以示哀感之意已亥正月嗣子生於新府第上聞之喜不已親灑宸翰并賜金幣爲賀庚子上念嗣子正在襁褓恐難遠離遣行人黄如桂齎勑諭暫免入朝俾得守視辛丑錫誥贈嫡母朱氏爲端柔順德玄君生母宋氏爲柔慈崇善玄君贈妻李氏爲冲虚柔惠玄君繼妻吴氏爲安妙善常玄君柳氏爲莊惠志道玄君本年命給部牒五百度羽士特勑江西巡撫都御史嚴禁撫州奸民僞出符籙者己酉詔携嗣子入覲舟次錢塘沙淤江涘民病涉投以一符即盪去次徐州水涸舟膠戲作一詩投之曰吕梁洪下疾如飛一派神棲接古徐願借紅袍三尺水官航穩載上京畿水忽夜溢比及都門上遣太監高忠迎而諭勞之齎賜嗣子蟒衣玉帶金帛明日召見錫燕便殿命録歷代真人名諱進覽旣而賜御札曰卿子名可曰永緒後乞致仕詔可之陛辭而還庚戌十一月忽夢逰岱宗十六日晨興沐浴更衣畢焚香隱几而化壽七十有一上聞嗟悼無已詎從侯爵例錫之卹典遣行人李琦錦衣千户王正億諭祭營塟勑定弋陽縣城東故叠山書院爲佳城皆異數也四十九代天師諱永緒字乆承别號三陽父湛然嘗夢介冑之士持刺來謁自稱三陽將軍刺上書九字者三而了無姓名忽大風飄去而寤翌日生焉玄典甫通間學擊劍出則佩劍巡行山澤中入則杜門謝絶諸賔客不喜逢迎似涉傲世嘉靖己酉詔隨父入朝抵都城上遣太監高忠齎賜衣帶明日召見於内庭賞賚有差命宴便殿詔嗣教襲爵誥授正一嗣教守玄養素遵範崇道大真人掌天下道教事詔聘定國公徐延德女爲配勑成國公朱希忠遂安伯陳鏸議行婚禮壬子入覲上遣司禮監太監黄錦傳㫖正一大真人張永緒著給與伯爵朝祭常服仍賜常用勑禮工二部製送光動朝班癸丑春仍奉玉音成婚帀目遣官護送還山勑駕部增驛券内例外應付以裕征途乙卯奉勑改建正一靜應祥符三觀工費不敷䟽奏請益以落成之戊午冬入覲上賜顧問曰爾父近來攝養飲食何如對曰臣父子沐高厚之恩洎舉家安享太平之賜然臣父自度犬馬氣衰每諄諄訓臣勉圖補報不敢時刻忘於宣室之前也上曰但不審而父復能一至朝否賜宴而出是年降勑諭有司查明雜差料價照舊盡行優免兵部查照新例給與勘合照舊例起撥馬快船隻嚴戒官員人等不許違慢再召入對賜燕便殿命建保國安民大醮於朝天宫有蟒衣玉帶之錫明年正月十三日上遣中使趙憲傳聖諭俾早回家以慰父望遂不俟大典禮終先陛辭而還甲子冬入覲上御西苑召問錫宴及蟒衣玉帶之屬乙丑元旦特遣中官傳命先諸大臣入見便殿旣而賜宴同大學士徐階等七臣上命以天師預首席焉醮於内庭復命主春祈祀典禮畢力辭還山舟次嚴陵瀨蹶然起而推篷四顧夕陽山色移時忽作語曰九九九𡚖時侯家隔數峰青還在無何有鼎湖將墜火龍髯我今先跨金牛走少間又曰暗來回首不須悲鷄鳴日出看依舊其聲斷續莫不訝之乃戒榜人遄櫂以前𡚖未幾而化内子徐氏以訃聞上殊痛悼之錫伯爵例恤興遣行人姚光泮諭祭併營兆域於獅子巷立祠南極觀誥封徐氏爲靜和元君仍降勑諭嚴戒族屬諸人毋得凌侮其聖恩隆重深加存惜保延玄緒以永紹宗風漢天師世家後序易曰顯道神德行是故可與酬酢可與祐神矣盈天地間古今不息者道也能顯明於道則功用之神具見而合乎德者故可與應萬變而賛祐於神矣是所謂叅天地之化育者也太史遷曰道家無爲精神尃一動合無形贍足萬物而與時遷移應物變化立俗施事無所不宜良有以哉太上生於殷爲周藏室史復遷柱下史以神化莫測之迹代降於世爲玄教宗我祖漢天師蒙留侯遺澤嘗親受道於太上由是仙經洞籙秘刼不傳者悉降於世繼以降治妖魅服煉神丹功成冲舉以劍印相傳於奕代者今垂千五百年雖運移物改繼承不替其非以清靜無爲之教功用之神有合乎天德而足以賛化育者歟迨今凡名山區奧靈迹具存此其子孫流芳之遠榮達之久信有以陰翊皇度博施生民者盖可見矣漢末而下居龍虎山者岩棲谷隱脩煉以自壽宋初漸以道行稱於時暨大觀崇寧間虚靖真君出焉其神功妙應一𤼵於御氣鍊形之實而後益振足以方駕於前矣其下莫顯於曾大父藢山公大父太玄公也凡其榮禬禱祈之著遭際寵渥之極當是時竒徴茂迹雖簪纓縉紳之士莫不禮敬之視前或有所未逮焉及我朝先君冲虚公光際聖明混一海宇其崇資偉望昭赫一時榮被終始又豈昔之可倫擬者哉其爲神明之冑必若是乎宇初以匪材庸質仰紹先烈惟忝竊是懼代蒙聖恩猶深戰慄間以世家顛末未白於世懼有遺闕昔侍先君手舊編一帙授高道傅同虚謁末太史濂序其首而未暇整緝以行然舊文辭意冗腐僣用删校增次以廣諸梓庶以成先志也嗚呼物理之有盛衰也思所以承先啓後者爲難哉末降以來棄實趨華兢於勢利者衆矣苟不能造詣其學輝光其德以引厥宗其可謂之克纘前人之緒乎是豈足知夫昔之授於太上者德行之隆勛烈之大其相傳之無窮也果何使之然哉抑神而明之存乎其人後之來者尚必自勵其有以章述焉斯爲不墜其教矣其曰世家則本諸史云嗣孫四十三代天師宇初百拜謹書大明萬曆三十五年歲次丁未上元吉旦
